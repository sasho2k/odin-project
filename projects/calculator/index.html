<!-- Boilerplate HTML structure -->

<!-- Head -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  
  <!-- CHANGE THE NAMES OF THE FILE -->
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <!-- CHANGE THE NAMES OF THE FILE -->
</head>

<!-- Body -->
<body>
    <div class="header">
        <h1 class="title">Calculator</h1>
    </div>

    <div class="calculator">
        <div class="display">
            <input id="input-display" type="text" readonly>
        </div>

        <div class="buttons">
            <div class="first-row">
                <button id="7" onclick="pressButton('7')">7</button>
                <button id="8" onclick="pressButton('8')">8</button>
                <button id="9" onclick="pressButton('9')">9</button>
                <button id="+" onclick="pressButton('+')">+</button>
            </div>
            <div class="second-row">
                <button id="4" onclick="pressButton('4')">4</button>
                <button id="5" onclick="pressButton('5')">5</button>
                <button id="6" onclick="pressButton('6')">6</button>
                <button id="-" onclick="pressButton('-')">-</button>
            </div>
            <div class="third-row">
                <button id="1" onclick="pressButton('1')">1</button>
                <button id="2" onclick="pressButton('2')">2</button>
                <button id="3" onclick="pressButton('3')">3</button>
                <button id="x" onclick="pressButton('x')">x</button>
            </div>
            <div class="fourth-row">
                <button id="0" onclick="pressButton('0')">0</button>
                <button id="clear" onclick="pressButton('c')">C</button>
                <button id="=" onclick="pressButton('=')">=</button>
                <button id="/" onclick="pressButton('/')">/</button>
            </div>
        </div>
    </div>
</body>

<!-- Closing HTML tag -->
</html>
